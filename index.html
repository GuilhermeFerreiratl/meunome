<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooperação - Jogos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00aaff">
</head>
<body>
  <header>
    <button id="menu-btn">☰</button>
    <img src="logo.png" alt="Logo" class="logo">
    <button id="search-btn">🔍</button>
  </header>

  <aside id="sidebar">
    <nav>
      <button class="menu-item active"><span>🔥</span> Popular</button>
      <button class="menu-item"><span>🎰</span> Slots</button>
      <button class="menu-item"><span>🐟</span> Pescaria</button>
      <button class="menu-item"><span>🕒</span> Recente</button>
      <button class="menu-item"><span>⭐</span> Favoritos</button>
    </nav>
  </aside>

  <main id="main-content">
    <section id="home-screen">
      <div class="section-title">
        <h2>🔥 Popular</h2>
      </div>
      <div class="grid" id="games-grid"></div>
    </section>

    <section id="game-screen" style="display:none;">
      <button id="back-btn">⬅ Voltar</button>
      <h2 id="game-title"></h2>
      <img id="game-img" src="" alt="">
      <div class="game-buttons-big">
        <button id="btn1">Abrir Opção 1</button>
        <button id="btn2">Abrir Opção 2</button>
        <button id="btn3">Abrir Opção 3</button>
      </div>
    </section>
  </main>

  <button id="topo-btn">🔔<br>TOPO</button>
  <script src="script.js"></script>
</body>
</html>
